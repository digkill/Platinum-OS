# Системная конфигурация Orange Pi Zero 3W с графической оболочкой.
#
# Учётные записи здесь намеренно отсутствуют: любой хеш пароля, попавший в
# репозиторий, стал бы общеизвестным credential всех собранных устройств.
# Но графической сессии учётная запись обязательна — автовход в несуществующего
# пользователя оставит устройство на пустом экране. Поэтому этот файл
# копируется оператором сборки, в копию дописывается пользователь, и сборка
# запускается с `--system <своя копия>`:
#
#   [[users]]
#   name = "platinum"
#   # openssl passwd -6   (хеш crypt(3); открытый пароль сборка не примет)
#   password_hash = "$6$..."
#   groups = ["sudo", "adm", "dialout", "netdev", "video", "input", "render"]
#   force_password_change = true
#
# Имя обязано совпадать с `autologin_user` ниже.

hostname = "platinum"
timezone = "Asia/Yekaterinburg"
locale = "en_US.UTF-8"

[network]
# У Zero 3W нет Ethernet, поэтому проводных интерфейсов для DHCP нет вовсе.
# Сеть на устройстве появляется только вместе с Wi-Fi, а SSID и PSK — секреты
# развёртывания, и в репозитории им не место. Дописываются в копию файла:
#
#   [[network.wifi]]
#   ssid = "имя-сети"
#   # PSK, а не пароль: `wpa_passphrase <ssid> <пароль>`
#   psk = "64 шестнадцатеричных символа"
#
# Renderer оставлен по умолчанию (networkd): NetworkManager сюда приезжал
# зависимостью Plasma, а Plasma в этом варианте нет.
dhcp_interfaces = []

# Графическая сессия. Автовход обязателен: у платы нет ни клавиатуры, ни
# экрана логина, на котором её ждали бы.
[shell]
session = "platinum-shell"
autologin_user = "platinum"
# Путь относительно этого файла.
homescreen = "../../shell/homescreen"

# Заставки загрузки здесь нет намеренно.
#
# Boot-скрипт Armbian для sun60iw2 строит `console=ttyS0,115200 console=tty1`
# сам, а Plymouth, обнаружив последовательную консоль, принудительно включает
# текстовую тему и не рисует заставку вовсе — проверено на Raspberry Pi 5
# журналом отладки. Первая загрузка платы к тому же и должна быть болтливой:
# по этому же UART её и отлаживают.

# cloud-init здесь тоже отсутствует.
#
# Его ценность — правка настроек после записи образа с любой машины, а это
# требует FAT-раздела, который читают macOS и Windows. У этой платы разделов
# один: ext4-корень, и seed на нём с macOS не отредактировать. Появится
# вместе с отдельным /boot.

[boot]
# Консоль здесь не задаётся: boot-скрипт Armbian строит `console=` сам из
# `console=both` в config/bootenv/sun60iw2.txt. Дубль в extra_cmdline попал бы
# в командную строку ядра вторым и разошёлся бы с upstream при его смене.
extra_cmdline = []
