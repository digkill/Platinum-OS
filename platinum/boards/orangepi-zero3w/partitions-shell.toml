# Разметка образа Orange Pi Zero 3W с графической оболочкой.
#
# Отличие от безэкранного `partitions.toml` — только размер корня. Границы
# области загрузчика те же и менять их нельзя: смещения `boot0_sdcard.fex` и
# `boot_package.fex` заданы BROM и Armbian, а не нами.
#
# Корень 6 GiB против 3 GiB безэкранного варианта: Qt 6, sddm, шрифты, тема
# курсора и терминал занимают заметно больше, а образ, в который состав не
# влез, обнаруживается только на `mkfs -d` в самом конце сборки. Рассчитано на
# карту 8 GB; на большем носителе файловая система расширяется при первом
# запуске.

# Область загрузчика: `boot_package.fex` (1.33 МиБ) пишется на 16400 KiB и
# заканчивается около 17.4 МиБ. 32 МиБ берутся из Armbian `OFFSET=32` — с
# запасом на рост blob-а.
reserved_mib = 32

[[partitions]]
name = "root"
label = "platinum-root"
filesystem = "ext4"
start_mib = 32
size_mib = 6144
mount_point = "/"
bootable = true
pass = 1
