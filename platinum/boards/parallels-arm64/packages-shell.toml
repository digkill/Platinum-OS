# Состав Platinum userspace поверх Ubuntu Base.
#
# Здесь только пакеты из архива Ubuntu: собственные пакеты Platinum появятся
# отдельной секцией, когда у платформы будет свой apt-репозиторий с ключом.
#
# Ubuntu Base приходит со своим `sources.list`, поэтому suite и зеркало здесь не
# переопределяются: рассинхронизация suite с базовым архивом ломает apt.
#
# Состав Platinum userspace для виртуальной машины arm64 с UEFI.
#
# Ядро приходит из архива Ubuntu, а не из BSP: linux-image-raspi — метапакет,
# который тянет актуальную сборку ядра Pi вместе с модулями и DTB.
#
# Он зависит от linux-firmware, и это осознанная плата за поддержку: у Pi 5
# Wi-Fi/BT работают на firmware из этого пакета. Образ из-за него заметно
# больше, поэтому корневой раздел в partitions.toml увеличен.

install_recommends = false

install = [
    # init и базовая инфраструктура системы
    "systemd",
    "systemd-sysv",
    "systemd-resolved",
    # Синхронизация времени: без неё `timedatectl set-ntp` не к чему
    # обращаться, а часы устройства уезжают уже за сутки.
    "systemd-timesyncd",
    "udev",
    "dbus",
    "kmod",

    # initramfs: kernel-пакеты Armbian вызывают его hooks при установке
    "initramfs-tools",

    # файловые системы образа и расширение rootfs при первом запуске
    "e2fsprogs",
    "dosfstools",
    "parted",

    # сеть, включая Wi-Fi платы
    "netplan.io",
    "iproute2",
    "iputils-ping",
    "wpasupplicant",
    "iw",
    "rfkill",

    # generic-ядро arm64: у виртуальной машины нет vendor-железа, а virtio
    # драйверы в нём уже есть
    "linux-image-generic",

    # загрузчик: прошивка UEFI ищет EFI/BOOT/BOOTAA64.EFI на разделе ESP
    "grub-efi-arm64",
    "grub-efi-arm64-bin",

    # графический стек: Wayland-композитор, оболочка и вход
    #
    # plasma-nano — минимальная оболочка Plasma; её домашний экран это
    # QML-плазмоид, поэтому он заменяется своим без правки композитора.
    "plasma-mobile",
    "plasma-nano",
    "plasma-settings",
    "kwin-wayland",
    "sddm",

    # экранная клавиатура Plasma Mobile; собственная оболочка её не использует
    "maliit-keyboard",

    # собственная оболочка: композитор-киоск и runtime QML
    #
    # Именно `qml-qt6`, а не `qt6-declarative-dev-tools`: второй несёт qmllint,
    # qmlformat и прочие инструменты, но самого runtime `qml` в нём нет —
    # выяснено по индексу содержимого архива после пустой сборки.
    "cage",
    "qml-qt6",
    "qml6-module-qtquick",
    "qml6-module-qtquick-window",
    "qml6-module-qtquick-shapes",
    "qml6-module-qtquick-effects",
    # QtCore для QML: Settings — этим модулем оболочка хранит тему и настройки
    "qml6-module-qtcore",
    # чтение каталога: им оболочка находит установленные приложения по их
    # `.desktop`, а не хранит список приложений устройства внутри себя
    "qml6-module-qt-labs-folderlistmodel",

    # оболочка — вложенный Wayland-композитор: модуль сцены чужих окон и
    # клиентская платформа Wayland для Qt-приложений
    "qml6-module-qtwayland-compositor",
    "qt6-wayland",

    # экранная клавиатура оболочки: панель живёт у композитора и обслуживает
    # и поля оболочки, и окна приложений. Не maliit: тот отдельный клиент со
    # своим протоколом, а эта панель — часть сцены, которую мы рисуем
    "qml6-module-qtquick-virtualkeyboard",
    "qt6-virtualkeyboard-plugin",

    # первое нативное приложение: терминал на Qt. Не foot: он требует wl_seat
    # v5 и wl_data_device_manager v3, а композитор QtWayland отдаёт v4 и v1 —
    # foot отказывается стартовать (проверено живым запуском 2026-08-07)
    "qterminal",

    # драйверы GPU: у виртуальной машины это virtio-gpu, ускорение программное
    "libgl1-mesa-dri",
    "libegl-mesa0",
    "mesa-vulkan-drivers",

    # шрифты: без них оболочка рисует пустые прямоугольники
    "fonts-noto-core",
    "fonts-noto-color-emoji",

    # заставка при загрузке; plymouth-label рисует текст темы
    "plymouth",
    "plymouth-label",

    # настройка первой загрузки с загрузочного раздела; тот же механизм
    # использует «OS customisation» в Raspberry Pi Imager
    "cloud-init",

    # доступ и базовая эксплуатация
    "openssh-server",
    "sudo",
    "ca-certificates",
    "locales",
    "tzdata",
    "less",
    "nano",
]
