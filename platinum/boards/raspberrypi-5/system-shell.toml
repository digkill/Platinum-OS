# Системная конфигурация образа Platinum OS.
#
# Учётные записи здесь намеренно отсутствуют: любой хеш пароля, попавший в
# репозиторий, стал бы общеизвестным credential всех собранных устройств.
# Пользователь задаётся оператором сборки — своим system.toml через
# `--system <path>` либо правкой этого файла перед сборкой:
#
#   [[users]]
#   name = "platinum"
#   # openssl passwd -6   (хеш crypt(3); открытый пароль сборка не примет)
#   password_hash = "$6$..."
#   groups = ["sudo", "adm", "dialout"]
#   # По умолчанию true: пароль придётся сменить при первом входе.
#   force_password_change = true
#
# Разделы fstab появятся вместе с partitions.toml: сейчас метки разделов ещё не
# определены, а выдуманные метки дали бы незагружаемую систему. Пока список
# пуст, сборка не трогает существующий /etc/fstab.
#
# У Pi 5 есть Ethernet, поэтому он поднимается по DHCP сразу. Wi-Fi сборкой не
# настраивается: SSID и PSK — секреты развёртывания.

hostname = "platinum-pi"
timezone = "Etc/UTC"
locale = "en_US.UTF-8"

[network]
dhcp_interfaces = ["eth0"]

# Графическая сессия. Автовход обязателен: на устройстве с сенсорным экраном
# и без клавиатуры экран логина — тупик.
[shell]
# Собственная оболочка вместо стоковой Plasma Mobile: домашний экран Platinum
# запускается композитором-киоском cage. Plasma Mobile остаётся установленной —
# на неё можно переключиться, поменяв session на `plasma-mobile`.
session = "platinum-shell"
autologin_user = "platinum"
# Путь относительно этого файла.
homescreen = "../../shell/homescreen"

[boot]
# У прошивки Pi нет собственного построителя `console=`, поэтому консоль
# задаётся здесь и уходит в cmdline.txt как есть.
#
# serial0 — алиас основного UART платы: на Pi 5 это ttyAMA10, и жёсткое имя
# устройства разошлось бы с ним при смене модели.
extra_cmdline = ["console=serial0,115200", "console=tty1"]

# timeout_deciseconds не действует: меню есть только у extlinux.
